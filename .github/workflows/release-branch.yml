name: Release branch

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish (move release to green main), or dry-run (leave release alone; the Release run shows the next version and publishes nothing)'
        type: choice
        options: [publish, dry-run]
        default: publish

permissions:
  contents: read

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  advance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-mover
    permissions:
      contents: read
      actions: write
      checks: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode || 'publish' }}
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          if [ "$MODE" = dry-run ]; then
            gh workflow run release.yml -R "$REPO" --ref release -f mode=dry-run
            say "dispatched a dry-run Release on release"
            exit 0
          fi
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          release=$(gh api "repos/$REPO/git/ref/heads/release" --jq .object.sha)
          if [ "$main" = "$release" ]; then
            say "release is already at main ($main); nothing to release"
            exit 0
          fi
          status=$(gh api "repos/$REPO/compare/$release...$main" --jq .status)
          if [ "$status" != ahead ]; then
            say "release ($release) is not an ancestor of main ($main): compare says $status; not moving it"
            exit 1
          fi
          green=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$main&status=success&per_page=50" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and (.event == "merge_group" or .event == "push") and .conclusion == "success")] | length')
          if [ "$green" -eq 0 ]; then
            say "no successful CI run (ci.yml, merge_group) at main ($main); release stays at $release"
            exit 0
          fi
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$work/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$work/known_hosts"
          git init -q "$work/repo"
          git -C "$work/repo" fetch -q --depth=1 "https://github.com/$REPO.git" "$main"
          if [ "$(git -C "$work/repo" rev-parse FETCH_HEAD)" != "$main" ]; then
            say "fetched $(git -C "$work/repo" rev-parse FETCH_HEAD), not $main; not moving release"
            exit 1
          fi
          GIT_SSH_COMMAND="ssh -i $work/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$work/known_hosts" \
            git -C "$work/repo" push -q "git@github.com:$REPO.git" "$main:refs/heads/release"
          say "release: $release -> $main (fast-forward, CI green); the push starts the Release run"
