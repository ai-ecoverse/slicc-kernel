name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    concurrency:
      group: release-tag
      cancel-in-progress: false
    env:
      LEFTHOOK: '0'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - id: head
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ] || git tag --points-at HEAD | grep -q '^v'; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "main has moved past $(git rev-parse --short HEAD); the run for the newer commit releases it" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - if: steps.head.outputs.current == 'true'
        run: npm ci

      - if: steps.head.outputs.current == 'true'
        run: npx semantic-release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        if: steps.head.outputs.current == 'true'
        run: |
          set -euo pipefail
          tags=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tr '\n' ' ' || true)
          for tag in $tags; do
            git ls-remote --exit-code origin "refs/tags/$tag" > /dev/null || git push origin "refs/tags/$tag"
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    if: github.ref == 'refs/heads/main' && needs.tag.outputs.tags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEFTHOOK: '0'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: node tools/release-recover.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: release / verify on npm
    needs: [tag, publish]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.tag.outputs.tags != '' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      LEFTHOOK: '0'
    permissions:
      contents: write
      issues: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/cert-review/gh.sh

      - name: Each tag on npm is the tarball release.yml built from the tag on main, and its notes carry the certified line
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.tag.outputs.tags }}
        run: |
          set -euo pipefail
          status=0
          for tag in $TAGS; do
            tools/cert-review/gate.sh verify node tools/cert-review/verify.mjs --repo "$GITHUB_REPOSITORY" --version "${tag#v}" --run "$GITHUB_RUN_ID" --wait 3600 || status=1
          done
          exit "$status"
