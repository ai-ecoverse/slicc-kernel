name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish, or dry-run (semantic-release --dry-run: shows the next version, publishes nothing)'
        type: choice
        options: [publish, dry-run]
        default: publish

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEFTHOOK: '0'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - id: head
        run: |
          git fetch -q origin release
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ] || git tag --points-at HEAD | grep -q '^v'; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "release has moved past $(git rev-parse --short HEAD); the run dispatched for the newer commit releases it" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - if: steps.head.outputs.current == 'true'
        run: npm ci

      - id: prior
        if: steps.head.outputs.current == 'true'
        run: echo "tags=$(git tag --points-at HEAD | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - if: steps.head.outputs.current == 'true' && inputs.mode == 'dry-run'
        run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: release
        if: steps.head.outputs.current == 'true' && inputs.mode != 'dry-run'
        run: npx semantic-release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.head.outputs.current == 'true' && inputs.mode != 'dry-run'
        run: node tools/release-recover.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_PRIOR_TAGS: ${{ steps.prior.outputs.tags }}
