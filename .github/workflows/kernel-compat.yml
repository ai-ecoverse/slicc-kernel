name: Kernel compat

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'build.mjs'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published kernel version to check, e.g. 1.86.0'
        type: string
        required: true
      set:
        description: 'kernel-compat set'
        type: string
        default: 'base,catalog,all'

permissions:
  contents: read

concurrency:
  group: kernel-compat-${{ github.ref }}-${{ github.event.workflow_run.head_sha || inputs.version }}
  cancel-in-progress: true

jobs:
  pack:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - env:
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          latest=$(npm view @ai-ecoverse/slicc-kernel version)
          IFS=. read -r major minor patch <<< "$latest"
          version="$major.$minor.$((patch + 1))-pr.$PR.$RUN"
          npm version "$version" --no-git-tag-version
          mkdir -p "$RUNNER_TEMP/kernel"
          npm pack --pack-destination "$RUNNER_TEMP/kernel"
          echo "packed @ai-ecoverse/slicc-kernel@$version from ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kernel-tgz
          path: ${{ runner.temp }}/kernel/*.tgz
          if-no-files-found: error
          retention-days: 7

  pr:
    needs: pack
    uses: ai-ecoverse/homescoop/.github/workflows/kernel-compat.yml@b14cf6400a39426f41e7ae28608173411b3c52a0
    permissions:
      contents: read
      actions: read
    with:
      homescoop-ref: b14cf6400a39426f41e7ae28608173411b3c52a0
      kernel: kernel-tgz
      set: base,ci-certified
      runner: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_RUNNER || 'ubuntu-latest' }}
      fail-on-regression: false

  pr-summary:
    needs: [pack, pr]
    if: ${{ !cancelled() && needs.pack.result == 'success' }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ needs.pr.result }}
          ARTIFACT: ${{ needs.pr.outputs.artifact }}
          VERDICT: ${{ needs.pr.outputs.verdict }}
          REGRESSIONS: ${{ needs.pr.outputs.regressions }}
        run: |
          set -euo pipefail
          id=""
          if [ -n "$ARTIFACT" ]; then
            id=$(node --input-type=module - <<'JS' || true
          const { API, REPO, RUN_ID, ARTIFACT, GH_TOKEN } = process.env;
          const r = await fetch(`${API}/repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100`, {
            headers: { authorization: `Bearer ${GH_TOKEN}`, accept: 'application/vnd.github+json' },
          });
          const j = await r.json();
          console.log((j.artifacts || []).find((a) => a.name === ARTIFACT)?.id ?? '');
          JS
          )
          fi
          case "$VERDICT" in
            pass) mark="✅" ;;
            regression) mark="❌" ;;
            *) mark="⚠️" ;;
          esac
          {
            echo "## $mark Kernel compat (non-blocking): ${VERDICT:-no verdict}"
            echo
            echo "- job result: $RESULT, regressions: ${REGRESSIONS:-unknown}"
            echo "- set: base,ci-certified, regressions are reported and do not fail this PR"
            if [ -n "$id" ]; then echo "- report: $RUN_URL/artifacts/$id"; fi
            echo "- run: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$VERDICT" = "regression" ]; then echo "::warning::kernel-compat found ${REGRESSIONS} regression(s): $RUN_URL"; fi

  published:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - id: version
        env:
          INPUT: ${{ inputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync } from 'node:fs';
          const { INPUT, SHA, API, REPO, GH_TOKEN, GITHUB_OUTPUT, GITHUB_STEP_SUMMARY } = process.env;
          const SEMVER = /^\d+\.\d+\.\d+$/;
          const cmp = (a, b) => {
            const x = a.split('.').map(Number);
            const y = b.split('.').map(Number);
            return x[0] - y[0] || x[1] - y[1] || x[2] - y[2];
          };
          let version = (INPUT || '').replace(/^v/, '');
          if (!version) {
            const r = await fetch(`${API}/repos/${REPO}/git/matching-refs/tags/v`, {
              headers: { authorization: `Bearer ${GH_TOKEN}`, accept: 'application/vnd.github+json' },
            });
            if (!r.ok) throw new Error(`tags of ${REPO}: HTTP ${r.status}`);
            const tags = (await r.json())
              .filter((t) => t.object.type === 'commit' && t.object.sha === SHA)
              .map((t) => t.ref.replace(/^refs\/tags\/v/, ''))
              .filter((v) => SEMVER.test(v))
              .sort(cmp);
            version = tags.at(-1) || '';
          }
          if (!version) {
            appendFileSync(GITHUB_STEP_SUMMARY, `no release tag at ${SHA}, nothing to check\n`);
            process.exit(0);
          }
          if (!SEMVER.test(version)) throw new Error(`version ${version} is not x.y.z`);
          const npm = await fetch(`https://registry.npmjs.org/@ai-ecoverse%2Fslicc-kernel/${version}`, {
            headers: { accept: 'application/json', 'cache-control': 'no-cache' },
          });
          if (!npm.ok) throw new Error(`npm does not serve @ai-ecoverse/slicc-kernel@${version}: HTTP ${npm.status}`);
          if ((await npm.json()).version !== version) throw new Error(`npm answered another version for ${version}`);
          console.log(`@ai-ecoverse/slicc-kernel@${version}`);
          appendFileSync(GITHUB_OUTPUT, `version=${version}\n`);
          JS

  release:
    needs: published
    if: needs.published.outputs.version != ''
    uses: ai-ecoverse/homescoop/.github/workflows/kernel-compat.yml@b14cf6400a39426f41e7ae28608173411b3c52a0
    permissions:
      contents: read
      actions: read
    with:
      homescoop-ref: b14cf6400a39426f41e7ae28608173411b3c52a0
      kernel: '@ai-ecoverse/slicc-kernel@${{ needs.published.outputs.version }}'
      set: ${{ inputs.set || 'base,catalog,all' }}
      runner: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_RUNNER || 'ubuntu-latest' }}

  attach:
    needs: [published, release]
    if: ${{ !cancelled() && needs.published.outputs.version != '' && needs.release.outputs.artifact != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.release.outputs.artifact }}
          path: ${{ runner.temp }}/report

      - env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT: ${{ needs.release.outputs.artifact }}
          VERSION: ${{ needs.published.outputs.version }}
          VERDICT: ${{ needs.release.outputs.verdict }}
          REGRESSIONS: ${{ needs.release.outputs.regressions }}
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const { GH_TOKEN, API, REPO, RUN_URL, RUN_ID, ARTIFACT, VERSION, VERDICT, REGRESSIONS, RUNNER_TEMP, GITHUB_STEP_SUMMARY } = process.env;
          const headers = { authorization: `Bearer ${GH_TOKEN}`, accept: 'application/vnd.github+json' };
          const api = async (url, init = {}) => {
            const r = await fetch(url.startsWith('http') ? url : `${API}/${url}`, { ...init, headers: { ...headers, ...init.headers } });
            if (!r.ok) throw new Error(`${init.method || 'GET'} ${url}: HTTP ${r.status} ${await r.text()}`);
            return r.status === 204 ? null : r.json();
          };
          const artifacts = await api(`repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100`);
          const id = artifacts.artifacts.find((a) => a.name === ARTIFACT)?.id ?? '';
          const summary = join(RUNNER_TEMP, 'report', 'summary.md');
          const name = `kernel-compat-v${VERSION}.md`;
          const body = [
            `# Kernel compat: @ai-ecoverse/slicc-kernel@${VERSION}`,
            '',
            `- verdict: ${VERDICT || 'unknown'}, regressions: ${REGRESSIONS || 'unknown'}`,
            `- run: ${RUN_URL}`,
            `- report: ${RUN_URL}/artifacts/${id}`,
            '',
            existsSync(summary) ? readFileSync(summary, 'utf8') : '',
          ].join('\n');
          appendFileSync(GITHUB_STEP_SUMMARY, body);
          const release = await api(`repos/${REPO}/releases/tags/v${VERSION}`);
          for (const a of release.assets.filter((x) => x.name === name)) {
            await api(`repos/${REPO}/releases/assets/${a.id}`, { method: 'DELETE' });
          }
          const upload = `${release.upload_url.replace(/\{.*\}$/, '')}?name=${encodeURIComponent(name)}`;
          const asset = await api(upload, { method: 'POST', headers: { 'content-type': 'text/markdown' }, body: Buffer.from(body) });
          console.log(`attached ${asset.browser_download_url}`);
          JS
