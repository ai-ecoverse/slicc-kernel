name: Kernel compat

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'build.mjs'
  workflow_dispatch:
    inputs:
      version:
        description: 'Kernel version to check, e.g. 1.86.0: the npm package, or the tarball named by run, artifact and sha256'
        type: string
        required: true
      set:
        description: 'kernel-compat set'
        type: string
        default: 'base,catalog,all'
      reference:
        description: 'Reference kernel, a published version (empty: the one slicc-bios pins); cert-review passes its certified base'
        type: string
        default: ''
      run:
        description: 'With artifact and sha256: the run (a Release or cert-review run) whose packed tarball is checked instead of npm'
        type: string
        default: ''
      artifact:
        description: 'The name of the packed tarball artifact in that run'
        type: string
        default: ''
      sha256:
        description: "The pack job's sha256 of the tarball"
        type: string
        default: ''

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Kernel compat v{0}{1}{2}{3}', inputs.version, inputs.sha256 != '' && format(' {0}', inputs.sha256) || '', inputs.set != 'base,catalog,all' && format(' ({0})', inputs.set) || '', inputs.reference != '' && format(' ref {0}', inputs.reference) || '') || github.event_name == 'pull_request' && github.event.pull_request.title || 'Kernel compat' }}

permissions:
  contents: read

concurrency:
  group: kernel-compat-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}-{2}-{3}', inputs.version, inputs.sha256, inputs.set, inputs.reference) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - env:
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          latest=$(npm view @ai-ecoverse/slicc-kernel version)
          IFS=. read -r major minor patch <<< "$latest"
          version="$major.$minor.$((patch + 1))-pr.$PR.$RUN"
          npm version "$version" --no-git-tag-version
          mkdir -p "$RUNNER_TEMP/kernel"
          npm pack --pack-destination "$RUNNER_TEMP/kernel"
          echo "packed @ai-ecoverse/slicc-kernel@$version from ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kernel-tgz
          path: ${{ runner.temp }}/kernel/*.tgz
          if-no-files-found: error
          retention-days: 7

  pr:
    needs: pack
    uses: ai-ecoverse/homescoop/.github/workflows/kernel-compat.yml@main
    permissions:
      contents: read
      actions: read
    with:
      homescoop-ref: main
      kernel: kernel-tgz
      set: base,ci-certified
      runner: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_RUNNER || 'ubuntu-latest' }}
      fail-on-regression: false

  pr-summary:
    needs: [pack, pr]
    if: ${{ !cancelled() && needs.pack.result == 'success' }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ needs.pr.result }}
          ARTIFACT: ${{ needs.pr.outputs.artifact }}
          VERDICT: ${{ needs.pr.outputs.verdict }}
          REGRESSIONS: ${{ needs.pr.outputs.regressions }}
        run: |
          set -euo pipefail
          id=""
          if [ -n "$ARTIFACT" ]; then
            id=$(node --input-type=module - <<'JS' || true
          const { API, REPO, RUN_ID, ARTIFACT, GH_TOKEN } = process.env;
          const r = await fetch(`${API}/repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100`, {
            headers: { authorization: `Bearer ${GH_TOKEN}`, accept: 'application/vnd.github+json' },
          });
          const j = await r.json();
          console.log((j.artifacts || []).find((a) => a.name === ARTIFACT)?.id ?? '');
          JS
          )
          fi
          case "$VERDICT" in
            pass) mark="✅" ;;
            regression) mark="❌" ;;
            *) mark="⚠️" ;;
          esac
          {
            echo "## $mark Kernel compat (non-blocking): ${VERDICT:-no verdict}"
            echo
            echo "- job result: $RESULT, regressions: ${REGRESSIONS:-unknown}"
            echo "- set: base,ci-certified, regressions are reported and do not fail this PR"
            if [ -n "$id" ]; then echo "- report: $RUN_URL/artifacts/$id"; fi
            echo "- run: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$VERDICT" = "regression" ]; then echo "::warning::kernel-compat found ${REGRESSIONS} regression(s): $RUN_URL"; fi

  candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.ref == 'refs/heads/main' && vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      kernel: ${{ steps.version.outputs.kernel }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate

      - id: version
        env:
          INPUT: ${{ inputs.version }}
          ARTIFACT: ${{ inputs.artifact }}
          RUN: ${{ inputs.run }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          node --input-type=module - <<'JS'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, copyFileSync, mkdirSync, readdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const { INPUT, ARTIFACT, RUN, SHA256, RUNNER_TEMP, GITHUB_OUTPUT } = process.env;
          const version = (INPUT || '').replace(/^v/, '');
          if (!(ARTIFACT ? /^\d+\.\d+\.\d+(?:-pr\.\d+\.\d+)?$/ : /^\d+\.\d+\.\d+$/).test(version)) throw new Error(`version ${version} is not x.y.z${ARTIFACT ? ' or x.y.z-pr.N.M' : ''}`);
          if (ARTIFACT) {
            if (!/^\d+$/.test(RUN || '') || !/^[0-9a-f]{64}$/.test(SHA256 || '')) throw new Error('artifact needs run and sha256');
            const dir = join(RUNNER_TEMP, 'candidate');
            const tgz = readdirSync(dir).filter((f) => f.endsWith('.tgz'));
            if (tgz.length !== 1) throw new Error(`artifact ${ARTIFACT} of run ${RUN} holds ${tgz.length} tarballs`);
            const file = join(dir, tgz[0]);
            const sha = createHash('sha256').update(readFileSync(file)).digest('hex');
            if (sha !== SHA256) throw new Error(`artifact ${ARTIFACT} of run ${RUN} is sha256 ${sha}, not ${SHA256}`);
            const manifest = JSON.parse(execFileSync('tar', ['-xzf', file, '-O', 'package/package.json'], { encoding: 'utf8' }));
            if (manifest.name !== '@ai-ecoverse/slicc-kernel' || manifest.version !== version) throw new Error(`the tarball is ${manifest.name}@${manifest.version}`);
            mkdirSync(join(RUNNER_TEMP, 'kernel'), { recursive: true });
            copyFileSync(file, join(RUNNER_TEMP, 'kernel', tgz[0]));
            console.log(`@ai-ecoverse/slicc-kernel@${version} sha256=${sha}`);
            appendFileSync(GITHUB_OUTPUT, `version=${version}\nkernel=kernel-tgz-${version}-${sha.slice(0, 12)}\n`);
            process.exit(0);
          }
          const npm = await fetch(`https://registry.npmjs.org/@ai-ecoverse%2Fslicc-kernel/${version}`, {
            headers: { accept: 'application/json', 'cache-control': 'no-cache' },
          });
          if (!npm.ok) throw new Error(`npm does not serve @ai-ecoverse/slicc-kernel@${version}: HTTP ${npm.status}`);
          if ((await npm.json()).version !== version) throw new Error(`npm answered another version for ${version}`);
          console.log(`@ai-ecoverse/slicc-kernel@${version}`);
          appendFileSync(GITHUB_OUTPUT, `version=${version}\nkernel=@ai-ecoverse/slicc-kernel@${version}\n`);
          JS

      - if: inputs.artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.version.outputs.kernel }}
          path: ${{ runner.temp }}/kernel/*.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    needs: candidate
    if: needs.candidate.outputs.version != ''
    uses: ai-ecoverse/homescoop/.github/workflows/kernel-compat.yml@main
    permissions:
      contents: read
      actions: read
    with:
      homescoop-ref: main
      kernel: ${{ needs.candidate.outputs.kernel }}
      set: ${{ inputs.set || 'base,catalog,all' }}
      reference: ${{ inputs.reference || '' }}
      runner: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["schedule","workflow_dispatch","workflow_run","release"]'), github.event_name) && github.ref == 'refs/heads/main')) && vars.CERT_RUNNER || 'ubuntu-latest' }}

  attach:
    needs: [candidate, release]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.candidate.outputs.version != '' && !contains(needs.candidate.outputs.version, '-pr.') && needs.release.outputs.artifact != '' }}
    runs-on: ${{ github.ref == 'refs/heads/main' && vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.release.outputs.artifact }}
          path: ${{ runner.temp }}/report

      - env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT: ${{ needs.release.outputs.artifact }}
          VERSION: ${{ needs.candidate.outputs.version }}
          VERDICT: ${{ needs.release.outputs.verdict }}
          REGRESSIONS: ${{ needs.release.outputs.regressions }}
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const { GH_TOKEN, API, REPO, RUN_URL, RUN_ID, ARTIFACT, VERSION, VERDICT, REGRESSIONS, RUNNER_TEMP, GITHUB_STEP_SUMMARY } = process.env;
          const headers = { authorization: `Bearer ${GH_TOKEN}`, accept: 'application/vnd.github+json' };
          const api = async (url, init = {}) => {
            const r = await fetch(url.startsWith('http') ? url : `${API}/${url}`, { ...init, headers: { ...headers, ...init.headers } });
            if (!r.ok) throw new Error(`${init.method || 'GET'} ${url}: HTTP ${r.status} ${await r.text()}`);
            return r.status === 204 ? null : r.json();
          };
          const artifacts = await api(`repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100`);
          const id = artifacts.artifacts.find((a) => a.name === ARTIFACT)?.id ?? '';
          const summary = join(RUNNER_TEMP, 'report', 'summary.md');
          const name = `kernel-compat-v${VERSION}.md`;
          const body = [
            `# Kernel compat: @ai-ecoverse/slicc-kernel@${VERSION}`,
            '',
            `- verdict: ${VERDICT || 'unknown'}, regressions: ${REGRESSIONS || 'unknown'}`,
            `- run: ${RUN_URL}`,
            `- report: ${RUN_URL}/artifacts/${id}`,
            '',
            existsSync(summary) ? readFileSync(summary, 'utf8') : '',
          ].join('\n');
          appendFileSync(GITHUB_STEP_SUMMARY, body);
          const release = await api(`repos/${REPO}/releases/tags/v${VERSION}`);
          for (const a of release.assets.filter((x) => x.name === name)) {
            await api(`repos/${REPO}/releases/assets/${a.id}`, { method: 'DELETE' });
          }
          const upload = `${release.upload_url.replace(/\{.*\}$/, '')}?name=${encodeURIComponent(name)}`;
          const asset = await api(upload, { method: 'POST', headers: { 'content-type': 'text/markdown' }, body: Buffer.from(body) });
          console.log(`attached ${asset.browser_download_url}`);
          JS
