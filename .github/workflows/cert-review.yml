name: cert-review

on:
  workflow_call:
    inputs:
      version:
        description: 'The tagged, unpublished version to certify, x.y.z (tag v<version>)'
        required: true
        type: string
      artifact:
        description: 'The artifact of this run that holds the packed tarball'
        required: true
        type: string
      sha256:
        description: "The pack job's sha256 of the tarball"
        required: true
        type: string
    secrets:
      AWS_BEARER_TOKEN_BEDROCK:
        description: 'The Bedrock key, for the review step only'
        required: true
    outputs:
      conclusion:
        description: 'success when record certified the tarball, else failure'
        value: ${{ jobs.record.outputs.conclusion }}
      sha256:
        description: 'The sha256 record computed from the artifact, empty unless certified'
        value: ${{ jobs.record.outputs.sha256 }}
      line:
        description: 'The line'
        value: ${{ jobs.record.outputs.line }}
  workflow_dispatch:
    inputs:
      version:
        description: 'The tagged version to replay, x.y.z (tag v<version>), packed again from its tag. Always a dry run: no status, notes, issues or publish'
        required: true
        type: string
      prev:
        description: 'The previous release the delta is read from, x.y.z (default: the newest earlier tag on npm)'
        required: false
        type: string
      base:
        description: 'The certified release the suite is compared with, x.y.z (default: the newest earlier cert-review success, or prev)'
        required: false
        type: string
      planted:
        description: 'Proofs only: a branch to pack and review instead of the tag (never certified)'
        required: false
        type: string
      pr:
        description: 'Proofs only: the pull request of the planted branch, read as one more delta row'
        required: false
        type: string

run-name: ${{ github.event_name == 'workflow_dispatch' && format('cert-review v{0}', inputs.version) || 'cert-review' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('cert-review-{0}{1}', inputs.version, inputs.planted) || format('cert-review-release-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  LEFTHOOK: '0'

jobs:
  plan:
    name: cert-review / plan
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    outputs:
      go: ${{ steps.plan.outputs.go }}
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      prev: ${{ steps.plan.outputs.prev }}
      base: ${{ steps.plan.outputs.base }}
      commit: ${{ steps.plan.outputs.commit }}
      planted: ${{ steps.plan.outputs.planted }}
      pr: ${{ steps.plan.outputs.pr }}
      covers: ${{ steps.plan.outputs.covers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          IN_ARTIFACT: ${{ inputs.artifact }}
          IN_SHA256: ${{ inputs.sha256 }}
          IN_VERSION: ${{ inputs.version }}
          IN_PREV: ${{ inputs.prev }}
          IN_BASE: ${{ inputs.base }}
          IN_PLANTED: ${{ inputs.planted }}
          IN_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          version=$IN_VERSION prev=$IN_PREV base=$IN_BASE planted='' pr=''
          [[ "$version" =~ $semver ]] || { echo "::error::version '$version' is not x.y.z"; exit 1; }
          git rev-parse -q --verify "refs/tags/v$version^{commit}" > /dev/null || { echo "::error::no tag v$version"; exit 1; }
          if [ -n "$IN_ARTIFACT" ]; then
            mode=release
            [ "$REF" = refs/heads/main ] || { echo "::error::a release review runs only on main, not $REF"; exit 1; }
            [[ "$IN_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sha256 '$IN_SHA256' is not a sha256"; exit 1; }
            prev='' base=''
          else
            mode=dispatch planted=$IN_PLANTED pr=$IN_PR
            if [ -n "$planted" ]; then
              [[ "$planted" =~ ^[A-Za-z0-9._/-]+$ ]] && [ "$planted" != main ] || { echo "::error::planted '$planted' is not a branch name"; exit 1; }
              [ -z "$pr" ] || [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::pr '$pr' is not a number"; exit 1; }
              git fetch -q origin "refs/heads/$planted:refs/remotes/origin/$planted"
            fi
          fi
          [ -n "$prev" ] || prev=$(node tools/cert-review/base.mjs --version "$version" --published)
          [[ "$prev" =~ $semver ]] || { echo "::error::prev '$prev' is not x.y.z"; exit 1; }
          if [ -z "$base" ]; then
            base=$(node tools/cert-review/base.mjs --repo "$GITHUB_REPOSITORY" --version "$version" || echo "$prev")
          fi
          [[ "$base" =~ $semver ]] || { echo "::error::base '$base' is not x.y.z"; exit 1; }
          for v in "$prev" "$base"; do
            git rev-parse -q --verify "refs/tags/v$v^{commit}" > /dev/null || { echo "::error::no tag v$v"; exit 1; }
          done
          if [ -n "$planted" ]; then commit=$(git rev-parse "origin/$planted^{commit}"); else commit=$(git rev-parse "v$version^{commit}"); fi
          {
            echo "go=true"
            echo "mode=$mode"
            echo "version=$version"
            echo "prev=$prev"
            echo "base=$base"
            echo "commit=$commit"
            echo "planted=$planted"
            echo "pr=$pr"
            echo "covers=$(node tools/cert-review/base.mjs --version "$version" --covers "$prev")"
          } | tee -a "$GITHUB_OUTPUT"

      - name: A pending cert-review status on the release commit (release runs only)
        if: steps.plan.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.plan.outputs.commit }}
          VERSION: ${{ steps.plan.outputs.version }}
          SHA256: ${{ inputs.sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$COMMIT" \
            -d "$(node -e 'console.log(JSON.stringify({ state: "pending", context: "cert-review", target_url: process.argv[1], description: process.argv[2] }))' \
              "$RUN_URL" "reviewing v$VERSION sha256=${SHA256:0:12}, not on npm until certified")" > /dev/null
          echo "pending cert-review status on $COMMIT"

  pack:
    name: cert-review / pack (replay)
    needs: plan
    if: needs.plan.outputs.go == 'true' && needs.plan.outputs.mode == 'dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - id: pack
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          PLANTED: ${{ needs.plan.outputs.planted }}
        run: |
          set -euo pipefail
          [ -z "$PLANTED" ] || git fetch -q origin "refs/heads/$PLANTED:refs/remotes/origin/$PLANTED"
          node tools/cert-review/pack.mjs --version "$VERSION" --ref "$COMMIT" --out "$RUNNER_TEMP/pack"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-tgz-${{ needs.plan.outputs.version }}
          path: |
            ${{ runner.temp }}/pack/*.tgz
            ${{ runner.temp }}/pack/*.tgz.sha256
            ${{ runner.temp }}/pack/pack.json
          if-no-files-found: error
          overwrite: true

  tarball:
    name: cert-review / tarball
    needs: [plan, pack]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && (needs.pack.result == 'success' || (needs.pack.result == 'skipped' && needs.plan.outputs.mode == 'release')) }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.check.outputs.artifact }}
      sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact || format('kernel-tgz-{0}', needs.plan.outputs.version) }}
          path: ${{ runner.temp }}/pack

      - id: check
        env:
          ARTIFACT: ${{ inputs.artifact || format('kernel-tgz-{0}', needs.plan.outputs.version) }}
          SHA256: ${{ inputs.sha256 || needs.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          tgz=("$RUNNER_TEMP"/pack/*.tgz)
          [ "${#tgz[@]}" = 1 ] && [ -f "${tgz[0]}" ] || { echo "::error::$ARTIFACT holds ${#tgz[@]} tarballs"; exit 1; }
          sha=$(sha256sum "${tgz[0]}" | cut -d' ' -f1)
          [ "$sha" = "$SHA256" ] || { echo "::error::$ARTIFACT is sha256 $sha, the pack job said $SHA256"; exit 1; }
          echo "$ARTIFACT: $(basename "${tgz[0]}") sha256=$sha"
          { echo "artifact=$ARTIFACT"; echo "sha256=$sha"; } >> "$GITHUB_OUTPUT"

  delta:
    name: cert-review / delta
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/cert-review/gh.sh

      - env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ needs.plan.outputs.prev }}
          VERSION: ${{ needs.plan.outputs.version }}
          HEAD_SHA: ${{ needs.plan.outputs.planted && needs.plan.outputs.commit || '' }}
          PR: ${{ needs.plan.outputs.pr }}
        run: |
          node tools/cert-review/delta.mjs --repo "$GITHUB_REPOSITORY" --prev "$PREV" --version "$VERSION" \
            --head "$HEAD_SHA" --pr "$PR" --out "$RUNNER_TEMP/evidence/delta.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cert-review-delta-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence/delta.json
          if-no-files-found: error
          overwrite: true

  suite:
    name: cert-review / suite ${{ matrix.which }}
    needs: [plan, delta, tarball]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && needs.delta.result == 'success' && needs.tarball.result == 'success' }}
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        which: [release, base]
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PREV: ${{ needs.plan.outputs.prev }}
      BASE: ${{ needs.plan.outputs.base }}
      WHICH: ${{ matrix.which }}
      PLANTED: ${{ needs.plan.outputs.planted }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      SHA256: ${{ needs.tarball.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cert-review-delta-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence

      - if: matrix.which == 'release'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.tarball.outputs.artifact }}
          path: ${{ runner.temp }}/pack

      - name: The tree at the tag, with its dependencies and Chromium, the packed tarball under review and the published ones
        run: |
          set -euo pipefail
          tag=$([ "$WHICH" = release ] && echo "$VERSION" || echo "$BASE")
          ref="v$tag"
          [ "$WHICH" != release ] || ref=$COMMIT
          [ -z "$PLANTED" ] || git fetch -q origin "refs/heads/$PLANTED:refs/remotes/origin/$PLANTED"
          tree="$RUNNER_TEMP/tree"
          git worktree add --detach "$tree" "$ref"
          (cd "$tree" && npm ci --no-audit --no-fund && npx playwright-core install --no-shell chromium)
          mkdir -p "$RUNNER_TEMP/tgz"
          if [ "$WHICH" = release ]; then
            tgz=("$RUNNER_TEMP"/pack/*.tgz)
            [ "$(sha256sum "${tgz[0]}" | cut -d' ' -f1)" = "$SHA256" ] || { echo "::error::the artifact is not sha256 $SHA256"; exit 1; }
            cp "${tgz[0]}" "$RUNNER_TEMP/tgz/ai-ecoverse-slicc-kernel-$tag.tgz"
          else
            (cd "$RUNNER_TEMP/tgz" && npm pack "@ai-ecoverse/slicc-kernel@$tag" --silent)
          fi
          if [ "$WHICH" = release ]; then
            for v in $(node -e 'const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log([...new Set([process.argv[2], ...Object.keys(d.baselines ?? {})])].join(" "))' "$RUNNER_TEMP/evidence/delta.json" "$PREV"); do
              (cd "$RUNNER_TEMP/tgz" && npm pack "@ai-ecoverse/slicc-kernel@$v" --silent)
            done
          fi
          ls -l "$RUNNER_TEMP/tgz"
          echo "TREE=$tree" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: The suite on the dist under test (no secrets in this step)
        run: |
          node tools/cert-review/suite.mjs --tree "$TREE" --tgz "$RUNNER_TEMP/tgz/ai-ecoverse-slicc-kernel-$TAG.tgz" \
            --out "$RUNNER_TEMP/evidence/$WHICH"

      - name: Each fix's tests on the dist of the release before it, the NEGATIVE (no secrets in this step)
        if: ${{ !cancelled() && matrix.which == 'release' }}
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/evidence"
          node -e '
            const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const groups = d.baselines ?? { [d.prev]: d.files };
            for (const [v, files] of Object.entries(groups)) if (files.length) console.log(v + " " + files.join(","));
          ' "$ev/delta.json" > "$RUNNER_TEMP/baselines.txt"
          grep -q "^$PREV " "$RUNNER_TEMP/baselines.txt" || \
            printf '{"files":[],"exit":0,"pass":0,"fail":0,"skip":0,"results":[]}\n' > "$ev/prev.json"
          while read -r v files; do
            out="$ev/prev-$v"
            [ "$v" = "$PREV" ] && out="$ev/prev"
            node tools/cert-review/suite.mjs --tree "$TREE" --tgz "$RUNNER_TEMP/tgz/ai-ecoverse-slicc-kernel-$v.tgz" \
              --files "$files" --out "$out" || true
          done < "$RUNNER_TEMP/baselines.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: cert-review-suite-${{ matrix.which }}-${{ needs.plan.outputs.version }}
          overwrite: true
          path: |
            ${{ runner.temp }}/evidence/*.json
            ${{ runner.temp }}/evidence/*.jsonl
            ${{ runner.temp }}/evidence/*.log
          if-no-files-found: ignore

  compat:
    name: cert-review / kernel-compat
    needs: [plan, tarball]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && needs.tarball.result == 'success' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 300
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/cert-review/gh.sh

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          PLANTED: ${{ needs.plan.outputs.planted }}
          ARTIFACT: ${{ needs.tarball.outputs.artifact }}
          SHA256: ${{ needs.tarball.outputs.sha256 }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          if [ -n "$PLANTED" ]; then
            echo '{"found":false,"planted":true}' > "$RUNNER_TEMP/evidence/compat.json"
            exit 0
          fi
          node tools/cert-review/compat.mjs --repo "$GITHUB_REPOSITORY" --version "$VERSION" --commit "$COMMIT" \
            --ref "$REF" --run "$RUN_ID" --artifact "$ARTIFACT" --sha256 "$SHA256" \
            --dispatch --rerun --wait 150 --reference "$BASE" --out "$RUNNER_TEMP/evidence/compat.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cert-review-compat-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence/compat.json
          if-no-files-found: error
          overwrite: true

      - name: A kernel-compat run that is missing or incomplete ends this job red, so re-run failed jobs repeats it
        run: |
          node -e '
            const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (c.planted) process.exit(0);
            if (!c.found) { console.log("::error::no kernel-compat run for this release"); process.exit(1); }
            const missing = c.missingShards ?? [];
            if (missing.length > 0 || (c.conclusion !== "success" && (c.regressions ?? []).length === 0)) {
              console.log("::error::kernel-compat " + c.run + " ended " + c.conclusion + " without a report from shards " + (missing.join(", ") || "unknown"));
              process.exit(1);
            }
          ' "$RUNNER_TEMP/evidence/compat.json"

  review:
    name: cert-review / review
    needs: [plan, delta, suite, compat]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && needs.delta.result == 'success' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PREV: ${{ needs.plan.outputs.prev }}
      BASE: ${{ needs.plan.outputs.base }}
      PLANTED: ${{ needs.plan.outputs.planted }}
      FILING: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.mode == 'release' && 'on' || 'off' }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/cert-review/gh.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cert-review-suite-*-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cert-review-delta-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: cert-review-compat-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence

      - name: Findings, in code
        id: findings
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/evidence"
          mkdir -p "$ev/logs" "$RUNNER_TEMP/cert-review"
          mv "$ev"/*.log "$ev/logs/" 2> /dev/null || true
          cp tools/cert-review/known.json "$ev/known.json"
          node tools/cert-review/findings.mjs --delta "$ev/delta.json" --prev "$ev/prev.json" \
            --release "$ev/release.json" --base "$ev/base.json" --compat "$ev/compat.json" --out "$ev/findings.json"
          {
            echo 'prompt<<CERT_PROMPT_END'
            EVIDENCE="$ev" OUT="$RUNNER_TEMP/cert-review" node tools/cert-review/prompt.mjs
            echo 'CERT_PROMPT_END'
          } >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        uses: anthropics/claude-code-action/base-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
          GH_TOKEN: ${{ github.token }}
        with:
          use_bedrock: 'true'
          show_full_output: ${{ github.event_name == 'workflow_dispatch' }}
          claude_args: |
            --model ${{ vars.CERT_BEDROCK_MODEL || 'global.anthropic.claude-opus-5-5' }}
            --allowedTools "Read,Write,Glob,Grep,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh pr view:*)${{ github.ref == 'refs/heads/main' && needs.plan.outputs.mode == 'release' && ',Bash(gh issue create:*)' || '' }}"
            --max-turns 200
          prompt: ${{ steps.findings.outputs.prompt }}

      - name: Evidence
        if: ${{ !cancelled() }}
        env:
          EXECUTION: ${{ steps.review.outputs.execution_file }}
        run: |
          cp "${EXECUTION:-/dev/null}" "$RUNNER_TEMP/evidence/claude-turns.json" 2> /dev/null || true
          mkdir -p "$RUNNER_TEMP/cert-review"
          cp "$RUNNER_TEMP/evidence/findings.json" "$RUNNER_TEMP/cert-review/findings.json" 2> /dev/null || true
          cp -r "$RUNNER_TEMP/cert-review" "$RUNNER_TEMP/evidence/" 2> /dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: cert-review-verdict-${{ needs.plan.outputs.version }}
          path: |
            ${{ runner.temp }}/cert-review/verdict.json
            ${{ runner.temp }}/cert-review/comment.md
            ${{ runner.temp }}/cert-review/findings.json
          if-no-files-found: ignore
          overwrite: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: cert-review-evidence-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
          overwrite: true

  record:
    name: cert-review / record
    needs: [plan, tarball, suite, compat, review]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && needs.review.result != 'cancelled' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      conclusion: ${{ steps.record.outputs.conclusion }}
      commit: ${{ steps.record.outputs.commit }}
      sha256: ${{ steps.record.outputs.sha256 }}
      line: ${{ steps.record.outputs.line }}
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PLANTED: ${{ needs.plan.outputs.planted }}
      PLAN_COMMIT: ${{ needs.plan.outputs.commit }}
      COVERS: ${{ needs.plan.outputs.covers }}
      SHA256: ${{ needs.tarball.outputs.sha256 || inputs.sha256 }}
      REVIEW: ${{ needs.review.result }}
      JOBS: tarball=${{ needs.tarball.result }},suite=${{ needs.suite.result }},kernel-compat=${{ needs.compat.result }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: gh
        run: tools/cert-review/gh.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: cert-review-verdict-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/cert-review

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: ${{ needs.tarball.outputs.artifact || inputs.artifact || format('kernel-tgz-{0}', needs.plan.outputs.version) }}
          path: ${{ runner.temp }}/pack

      - name: The line, from the artifact, the findings and the verdict
        id: record
        run: |
          mkdir -p "$RUNNER_TEMP/cert-review" "$RUNNER_TEMP/pack"
          findings="$RUNNER_TEMP/cert-review/findings.json"
          tgz=$(find "$RUNNER_TEMP/pack" -maxdepth 1 -name '*.tgz' | head -1)
          if node tools/cert-review/record.mjs --version "$VERSION" --review "$RUNNER_TEMP/cert-review" \
            --out "$RUNNER_TEMP/record" --run "$RUN_URL" --repo "$GH_REPO" --commit "$PLAN_COMMIT" \
            --tarball "$tgz" --sha256 "$SHA256" --review-result "$REVIEW" --jobs "$JOBS" \
            --findings "$findings" --covers "$COVERS" ${PLANTED:+--planted "$PLANTED"}; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
            echo "sha256=$(node -p 'require(process.argv[1]).sha256 || ""' "$RUNNER_TEMP/record/record.json")" >> "$GITHUB_OUTPUT"
          else
            state=$(node -p 'require(process.argv[1]).state || "failure"' "$RUNNER_TEMP/record/record.json" 2> /dev/null || echo failure)
            echo "conclusion=$state" >> "$GITHUB_OUTPUT"
          fi
          commit=$(node -p 'require(process.argv[1]).commit || ""' "$RUNNER_TEMP/record/record.json")
          echo "commit=${commit:-$PLAN_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "line=$(head -1 "$RUNNER_TEMP/record/line.txt")" >> "$GITHUB_OUTPUT"
          { echo '```'; cat "$RUNNER_TEMP/record/line.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: cert-review-record-${{ needs.plan.outputs.version }}
          path: |
            ${{ runner.temp }}/record/record.json
            ${{ runner.temp }}/record/line.txt
            ${{ runner.temp }}/record/body.md
          if-no-files-found: error
          overwrite: true

      - name: A FAIL ends record red, so re-run failed jobs reviews again
        if: steps.record.outputs.conclusion != 'success'
        env:
          LINE: ${{ steps.record.outputs.line }}
        run: |
          echo "::error title=v$VERSION not certified::$LINE"
          exit 1

  status:
    name: cert-review / status
    needs: [plan, record]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.record.outputs.conclusion != '' &&
      needs.plan.outputs.mode == 'release' && needs.plan.outputs.planted == ''
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CONCLUSION: ${{ needs.record.outputs.conclusion }}
      COMMIT: ${{ needs.record.outputs.commit }}
      ARTIFACT: ${{ needs.record.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: gh
        run: tools/cert-review/gh.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cert-review-record-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/record

      - name: The cert-review status on the release commit, and the line in the release notes
        run: |
          set -euo pipefail
          line=$(head -1 "$RUNNER_TEMP/record/line.txt")
          gh api "repos/$GH_REPO/statuses/$COMMIT" \
            -f state="$CONCLUSION" -f context=cert-review -f target_url="$RUN_URL/artifacts/$ARTIFACT" \
            -f description="$(printf '%s' "$line" | cut -c1-140)" \
            --jq '"status \(.id) \(.state) on \(.url)"'
          if gh release view "v$VERSION" --json body --jq .body > "$RUNNER_TEMP/notes.md" 2> /dev/null; then
            node -e '
              const fs = require("node:fs");
              const [notes, body] = process.argv.slice(1).map((f) => fs.readFileSync(f, "utf8"));
              const kept = notes.replace(/\n*<!-- cert-review -->[\s\S]*?<!-- \/cert-review -->\n*/g, "").trimEnd();
              fs.writeFileSync(process.argv[1], kept + "\n\n" + body);
            ' "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/record/body.md"
            gh release edit "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" > /dev/null
            echo "release v$VERSION: $line"
          else
            echo "::warning::no GitHub release for v$VERSION, so the line is only in the status and the artifact"
          fi

  gate:
    name: cert-review / publish gate (dry run)
    needs: [plan, tarball, record]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'dispatch' && needs.record.outputs.conclusion != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.tarball.outputs.artifact }}
          path: ${{ runner.temp }}/pack

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cert-review-record-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/record

      - name: The publish job's gate and npm publish, as a dry run, with no OIDC token
        env:
          SHA256: ${{ needs.tarball.outputs.sha256 }}
        run: |
          tgz=$(find "$RUNNER_TEMP/pack" -maxdepth 1 -name '*.tgz' | head -1)
          node tools/cert-review/publish.mjs --dry-run --tarball "$tgz" --record "$RUNNER_TEMP/record/record.json" --sha256 "$SHA256"
