name: cert-review-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ ((github.event.action == 'labeled' && github.event.label.name != 'merge-ok' && github.event.label.name != 'cert-review-approved') || (github.event.action == 'unlabeled' && github.event.label.name != 'cert-review-approved') || github.event.action == 'ready_for_review') && format('cert-review-pr-noop-{0}', github.run_id) || format('cert-review-pr-{0}', github.event.pull_request.number || github.event.merge_group.head_sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LEFTHOOK: '0'
  CERT_CONTEXT: cert-review

jobs:
  guard:
    name: cert-review-pr / self-guard
    if: github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: write
    outputs:
      status: ${{ steps.cert.outputs.status }}
      override: ${{ steps.override.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - id: guard
        continue-on-error: true
        uses: ai-ecoverse/slicc-shared-web/.github/actions/cert-self-guard@fe97ae242f8ddcc824334cad287346d7df3f0bbb
        with:
          approval-label: cert-review-approved
          paths: |
            .github/workflows/cert*.yml
            .github/workflows/cert*.yaml
            scripts/cert/**
            scripts/cert/.*
            scripts/cert/.*/**
            scripts/cert/**/.*
            scripts/cert/**/.*/**
            tools/cert-review/**
            tools/cert-review/.*
            tools/cert-review/.*/**
            tools/cert-review/**/.*
            tools/cert-review/**/.*/**
            .github/actions/cert-self-guard/**
            .github/actions/cert-self-guard/.*
            .github/actions/cert-self-guard/.*/**
            .github/actions/cert-self-guard/**/.*
            .github/actions/cert-self-guard/**/.*/**
            .github/runner.mjs

      - id: override
        name: downstream-override, the coordinator's head-bound waiver of a downstream failure (every pull request in a group needs it on its head)
        continue-on-error: true
        uses: ai-ecoverse/slicc-shared-web/.github/actions/cert-self-guard@fe97ae242f8ddcc824334cad287346d7df3f0bbb
        with:
          approval-label: downstream-override
          paths: |
            **
            .*
            .*/**
            **/.*
            **/.*/**

      - id: cert
        name: The cert-path guard fails closed, a reviewer path its globs missed still needs the label
        env:
          RECEIPT: ${{ steps.guard.outputs.receipt }}
          STATUS: ${{ steps.guard.outputs.status }}
        run: |
          node -e '
            const dirs = ["scripts/cert/", "tools/cert-review/", ".github/actions/cert-self-guard/"];
            const reviewer = (p) => dirs.some((d) => p.startsWith(d)) || /^\.github\/workflows\/cert[^/]*\.ya?ml$/.test(p) || p === ".github/runner.mjs";
            let r;
            try { r = JSON.parse(process.env.RECEIPT); } catch {}
            let status = process.env.STATUS || "INCOMPLETE";
            const missed = [];
            if (status === "PASS") {
              if (!r || !Array.isArray(r.members)) status = "INCOMPLETE";
              else for (const m of r.members) {
                if (!Array.isArray(m.paths) || !Array.isArray(m.touched)) {
                  status = "INCOMPLETE";
                  missed.length = 0;
                  break;
                }
                const left = m.paths.filter((p) => reviewer(p) && !m.touched.includes(p));
                if (left.length && m.approved !== true) missed.push("#" + m.pr + ": " + left.join(", "));
              }
              if (missed.length && status === "PASS") status = "FAIL";
            }
            console.log("cert guard: " + status + (missed.length ? " (reviewer paths the globs missed, without the label: " + missed.join("; ") + ")" : ""));
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "status=" + status + "\n");
          '

  plan:
    name: cert-review-pr / plan
    needs: guard
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      go: ${{ steps.plan.outputs.go }}
      self: ${{ steps.plan.outputs.self }}
      manifest: ${{ steps.plan.outputs.manifest }}
      version: ${{ steps.versions.outputs.version }}
      prev: ${{ steps.versions.outputs.prev }}
      base: ${{ steps.versions.outputs.prev }}
      latest: ${{ steps.versions.outputs.latest }}
      commit: ${{ steps.versions.outputs.commit }}
      parent: ${{ steps.versions.outputs.parent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: The trees under test, the pull request merged onto main and its first parent, with main's tools
        run: git fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GUARD: ${{ needs.guard.outputs.status }}
        run: |
          tools/cert-review/gate.sh 'pr plan' node tools/cert-review/pr.mjs plan --repo "$GITHUB_REPOSITORY" --pr "$PR" --head "$HEAD_SHA" \
            --action "$ACTION" --label "$LABEL" --labels "$LABELS" --run "$GITHUB_RUN_ID" --context "$CERT_CONTEXT" \
            --guard "$GUARD" --approval cert-review-approved

      - id: versions
        if: steps.plan.outputs.go == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          latest=$(npm view @ai-ecoverse/slicc-kernel dist-tags.latest --prefer-online)
          [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::npm's latest reads as '$latest'"; exit 1; }
          IFS=. read -r major minor patch <<< "$latest"
          {
            echo "latest=$latest"
            echo "version=$major.$minor.$((patch + 1))-pr.$PR.$GITHUB_RUN_ID"
            echo "prev=$latest-base.$PR.$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "parent=$(git rev-parse "$GITHUB_SHA^1")"
          } | tee -a "$GITHUB_OUTPUT"

      - name: A plan that failed still leaves a status, so the required check never waits forever
        if: failure() && (steps.plan.outputs.posted != 'true' || steps.plan.outputs.go == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"error\",\"context\":\"$CERT_CONTEXT\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"cert-review did not finish its plan: re-run the failed jobs\"}" > /dev/null

  pack:
    name: cert-review-pr / pack candidate
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      candidate: ${{ steps.pack.outputs.sha256 }}
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: The trees under test, the pull request merged onto main and its first parent, with main's tools
        run: git fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - id: pack
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          REF: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          tools/cert-review/gate.sh pack node tools/cert-review/pack.mjs --version "$VERSION" --ref "$REF" --out "$RUNNER_TEMP/pack"
          echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP"/pack/*.tgz.sha256)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: upload
        with:
          name: kernel-tgz-${{ needs.plan.outputs.version }}
          path: |
            ${{ runner.temp }}/pack/*.tgz
            ${{ runner.temp }}/pack/*.tgz.sha256
            ${{ runner.temp }}/pack/pack.json
          if-no-files-found: error

  pack-base:
    name: cert-review-pr / pack base
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: The trees under test, the pull request merged onto main and its first parent, with main's tools
        run: git fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      - id: pack
        env:
          VERSION: ${{ needs.plan.outputs.prev }}
          REF: ${{ needs.plan.outputs.parent }}
        run: |
          set -euo pipefail
          tools/cert-review/gate.sh pack node tools/cert-review/pack.mjs --version "$VERSION" --ref "$REF" --out "$RUNNER_TEMP/pack"
          echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP"/pack/*.tgz.sha256)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: upload
        with:
          name: kernel-tgz-${{ needs.plan.outputs.prev }}
          path: |
            ${{ runner.temp }}/pack/*.tgz
            ${{ runner.temp }}/pack/*.tgz.sha256
            ${{ runner.temp }}/pack/pack.json
          if-no-files-found: error

  same:
    name: cert-review-pr / same dist
    needs: [plan, pack, pack-base, delta]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && needs.plan.outputs.manifest == 'true' && needs.pack.result == 'success' && needs.pack-base.result == 'success' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      statuses: write
    outputs:
      identical: ${{ steps.same.outputs.identical }}
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: The run holds exactly the two packed builds and the delta, each the one its job uploaded, and no other evidence yet
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PREV: ${{ needs.plan.outputs.prev }}
          CANDIDATE: ${{ needs.pack.outputs.id }}@${{ needs.pack.outputs.digest }}
          BASE: ${{ needs.pack-base.outputs.id }}@${{ needs.pack-base.outputs.digest }}
          DELTA: ${{ needs.delta.outputs.id }}@${{ needs.delta.outputs.digest }}
        run: |
          tools/cert-review/gate.sh artifacts node tools/cert-review/artifacts.mjs --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" \
            --prefix kernel-tgz- --prefix cert-review- --expect "kernel-tgz-$VERSION=$CANDIDATE" --expect "kernel-tgz-$PREV=$BASE" \
            --expect "cert-review-delta-$VERSION=$DELTA"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.pack.outputs.id }}
          path: ${{ runner.temp }}/packs/kernel-tgz-${{ needs.plan.outputs.version }}
          digest-mismatch: error

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.pack-base.outputs.id }}
          path: ${{ runner.temp }}/packs/kernel-tgz-${{ needs.plan.outputs.prev }}
          digest-mismatch: error

      - id: same
        name: Only package.json or its lock changed, so compare what ships, the packed candidate against the packed base
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PREV: ${{ needs.plan.outputs.prev }}
        run: |
          tools/cert-review/gate.sh same node tools/cert-review/same.mjs --candidate "$RUNNER_TEMP/packs/kernel-tgz-$VERSION/ai-ecoverse-slicc-kernel-$VERSION.tgz" \
            --base "$RUNNER_TEMP/packs/kernel-tgz-$PREV/ai-ecoverse-slicc-kernel-$PREV.tgz" --candidate-version "$VERSION" --base-version "$PREV" \
            --out "$RUNNER_TEMP/same/same.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: upload
        if: ${{ !cancelled() }}
        with:
          name: cert-review-same-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/same/same.json
          if-no-files-found: ignore

      - name: Identical dist is not behaviour, and the status says so with both builds' sha256
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tools/cert-review/gate.sh 'pr same' node tools/cert-review/pr.mjs same --repo "$GITHUB_REPOSITORY" --pr "$PR" --head "$HEAD_SHA" \
            --run "$GITHUB_RUN_ID" --context "$CERT_CONTEXT" --evidence "$RUNNER_TEMP/same/same.json"

  delta:
    name: cert-review-pr / delta
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    outputs:
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/cert-review/gh.sh

      - env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ needs.plan.outputs.prev }}
          VERSION: ${{ needs.plan.outputs.version }}
          HEAD_SHA: ${{ needs.plan.outputs.commit }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          tools/cert-review/gate.sh delta node tools/cert-review/delta.mjs --repo "$GITHUB_REPOSITORY" --prev "$PREV" --version "$VERSION" \
            --head "$HEAD_SHA" --pr "$PR" --only --out "$RUNNER_TEMP/evidence/delta.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: upload
        with:
          name: cert-review-delta-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence/delta.json
          if-no-files-found: error

  suite:
    name: cert-review-pr / suite ${{ matrix.which }}
    needs: [plan, pack, pack-base, delta, same]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && needs.same.outputs.identical != 'true' && needs.pack.result == 'success' && needs.pack-base.result == 'success' && needs.delta.result == 'success' }}
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        which: [release, base]
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PREV: ${{ needs.plan.outputs.prev }}
      WHICH: ${{ matrix.which }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      PARENT: ${{ needs.plan.outputs.parent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: The trees under test, the pull request merged onto main and its first parent, with main's tools
        run: git fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.delta.outputs.id }}
          path: ${{ runner.temp }}/evidence
          digest-mismatch: error

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.pack.outputs.id }}
          path: ${{ runner.temp }}/packs/kernel-tgz-${{ needs.plan.outputs.version }}
          digest-mismatch: error

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.pack-base.outputs.id }}
          path: ${{ runner.temp }}/packs/kernel-tgz-${{ needs.plan.outputs.prev }}
          digest-mismatch: error

      - name: The tree (the pull request on main, or main), its dependencies and Chromium, and both packed builds
        run: |
          set -euo pipefail
          ref=$([ "$WHICH" = release ] && echo "$COMMIT" || echo "$PARENT")
          tag=$([ "$WHICH" = release ] && echo "$VERSION" || echo "$PREV")
          tree="$RUNNER_TEMP/tree"
          git worktree add --detach "$tree" "$ref"
          (cd "$tree" && npm ci --no-audit --no-fund && npx playwright-core install --no-shell chromium)
          mkdir -p "$RUNNER_TEMP/tgz"
          cp "$RUNNER_TEMP"/packs/kernel-tgz-*/*.tgz "$RUNNER_TEMP/tgz/"
          ls -l "$RUNNER_TEMP/tgz"
          echo "TREE=$tree" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: The suite on the packed build (no secrets in this step)
        run: |
          tools/cert-review/gate.sh --either suite node tools/cert-review/suite.mjs --tree "$TREE" --tgz "$RUNNER_TEMP/tgz/ai-ecoverse-slicc-kernel-$TAG.tgz" \
            --out "$RUNNER_TEMP/evidence/$WHICH"

      - name: The pull request's tests on main's tree and main's build, the NEGATIVE (no secrets in this step)
        if: ${{ !cancelled() && matrix.which == 'base' }}
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/evidence"
          files=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).files.join(","))' "$ev/delta.json")
          if [ -n "$files" ]; then
            git -C "$TREE" diff --binary "$PARENT" "$COMMIT" -- test/ > "$RUNNER_TEMP/tests.patch"
            if [ -s "$RUNNER_TEMP/tests.patch" ]; then git -C "$TREE" apply "$RUNNER_TEMP/tests.patch"; fi
            tools/cert-review/gate.sh --evidence suite node tools/cert-review/suite.mjs --tree "$TREE" --tgz "$RUNNER_TEMP/tgz/ai-ecoverse-slicc-kernel-$PREV.tgz" \
              --files "$files" --out "$ev/prev"
          else
            printf '{"files":[],"exit":0,"pass":0,"fail":0,"skip":0,"results":[]}\n' > "$ev/prev.json"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: cert-review-suite-${{ matrix.which }}-${{ needs.plan.outputs.version }}
          path: |
            ${{ runner.temp }}/evidence/*.json
            ${{ runner.temp }}/evidence/*.jsonl
            ${{ runner.temp }}/evidence/*.log
          if-no-files-found: ignore

  compat:
    name: cert-review-pr / kernel-compat
    needs: [plan, pack, same]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && needs.same.outputs.identical != 'true' && needs.pack.result == 'success' }}
    outputs:
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 300
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/cert-review/gh.sh

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          SHA256: ${{ needs.pack.outputs.candidate }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          tools/cert-review/gate.sh --either compat node tools/cert-review/compat.mjs --repo "$GITHUB_REPOSITORY" --version "$VERSION" --commit "$COMMIT" \
            --ref main --run "$GITHUB_RUN_ID" --artifact "kernel-tgz-$VERSION" --sha256 "$SHA256" \
            --shards 10 --dispatch --rerun --wait 150 --reference "$LATEST" --out "$RUNNER_TEMP/evidence/compat.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: upload
        with:
          name: cert-review-compat-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence/compat.json
          if-no-files-found: error

  review:
    name: cert-review-pr / review
    needs: [plan, pack, delta, same, suite, compat]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && needs.same.outputs.identical != 'true' && needs.delta.result == 'success' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.verdict.outputs.artifact-id }}
      verdict_digest: ${{ steps.verdict.outputs.artifact-digest }}
      evidence: ${{ steps.evidence.outputs.artifact-id }}
      evidence_digest: ${{ steps.evidence.outputs.artifact-digest }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PREV: ${{ needs.plan.outputs.prev }}
      BASE: ${{ needs.plan.outputs.base }}
      PR: ${{ github.event.pull_request.number }}
      FILING: 'off'
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/cert-review/gh.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: cert-review-suite-release-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: cert-review-suite-base-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.delta.outputs.id }}
          path: ${{ runner.temp }}/evidence
          digest-mismatch: error

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: ${{ needs.compat.outputs.id != '' }}
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.compat.outputs.id }}
          path: ${{ runner.temp }}/evidence
          digest-mismatch: error

      - name: Findings, in code
        id: findings
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/evidence"
          mkdir -p "$ev/logs" "$RUNNER_TEMP/cert-review"
          mv "$ev"/*.log "$ev/logs/" 2> /dev/null || true
          cp tools/cert-review/known.json "$ev/known.json"
          tools/cert-review/gate.sh findings node tools/cert-review/findings.mjs --delta "$ev/delta.json" --prev "$ev/prev.json" \
            --release "$ev/release.json" --base "$ev/base.json" --compat "$ev/compat.json" --out "$ev/findings.json"
          {
            echo 'prompt<<CERT_PROMPT_END'
            EVIDENCE="$ev" OUT="$RUNNER_TEMP/cert-review" node tools/cert-review/prompt.mjs
            echo 'CERT_PROMPT_END'
          } >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        uses: anthropics/claude-code-action/base-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
          GH_TOKEN: ${{ github.token }}
        with:
          use_bedrock: 'true'
          claude_args: |
            --model ${{ vars.CERT_BEDROCK_MODEL || 'global.anthropic.claude-opus-5-5' }}
            --allowedTools "Read,Write,Glob,Grep,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh pr view:*)"
            --max-turns 200
          prompt: ${{ steps.findings.outputs.prompt }}

      - name: Evidence
        if: ${{ !cancelled() }}
        env:
          EXECUTION: ${{ steps.review.outputs.execution_file }}
        run: |
          cp "${EXECUTION:-/dev/null}" "$RUNNER_TEMP/evidence/claude-turns.json" 2> /dev/null || true
          mkdir -p "$RUNNER_TEMP/cert-review"
          cp "$RUNNER_TEMP/evidence/findings.json" "$RUNNER_TEMP/cert-review/findings.json" 2> /dev/null || true
          cp -r "$RUNNER_TEMP/cert-review" "$RUNNER_TEMP/evidence/" 2> /dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: verdict
        if: ${{ !cancelled() }}
        with:
          name: cert-review-verdict-${{ needs.plan.outputs.version }}
          path: |
            ${{ runner.temp }}/cert-review/verdict.json
            ${{ runner.temp }}/cert-review/comment.md
            ${{ runner.temp }}/cert-review/findings.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: evidence
        if: ${{ !cancelled() }}
        with:
          name: cert-review-evidence-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore

  record:
    name: cert-review-pr / record
    needs: [plan, pack, pack-base, delta, same, suite, compat, review]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && needs.same.outputs.identical != 'true' && needs.review.result != 'cancelled' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      conclusion: ${{ steps.record.outputs.conclusion }}
      commit: ${{ steps.record.outputs.commit }}
      line: ${{ steps.record.outputs.line }}
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PLAN_COMMIT: ${{ needs.plan.outputs.commit }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SHA256: ${{ needs.pack.outputs.candidate }}
      REVIEW: ${{ needs.review.result }}
      JOBS: pack=${{ needs.pack.result }},pack-base=${{ needs.pack-base.result }},delta=${{ needs.delta.result }},suite=${{ needs.suite.result }},kernel-compat=${{ needs.compat.result }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: gh
        run: tools/cert-review/gh.sh

      - name: Every evidence artifact of the run is the one its producer job uploaded, and there is no other
        id: artifacts
        continue-on-error: true
        env:
          PREV: ${{ needs.plan.outputs.prev }}
          CANDIDATE: ${{ needs.pack.outputs.id }}@${{ needs.pack.outputs.digest }}
          BASE: ${{ needs.pack-base.outputs.id }}@${{ needs.pack-base.outputs.digest }}
          DELTA: ${{ needs.delta.outputs.id }}@${{ needs.delta.outputs.digest }}
          SAME: ${{ needs.same.outputs.id }}@${{ needs.same.outputs.digest }}
          COMPAT: ${{ needs.compat.outputs.id }}@${{ needs.compat.outputs.digest }}
          VERDICT: ${{ needs.review.outputs.verdict }}@${{ needs.review.outputs.verdict_digest }}
          EVIDENCE: ${{ needs.review.outputs.evidence }}@${{ needs.review.outputs.evidence_digest }}
        run: |
          tools/cert-review/gate.sh artifacts node tools/cert-review/artifacts.mjs --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" \
            --prefix kernel-tgz- --prefix cert-review- \
            --expect "kernel-tgz-$VERSION=$CANDIDATE" --expect "kernel-tgz-$PREV=$BASE" \
            --expect "cert-review-delta-$VERSION=$DELTA" --expect "cert-review-same-$VERSION=$SAME" \
            --expect "cert-review-compat-$VERSION=$COMPAT" --expect "cert-review-verdict-$VERSION=$VERDICT" \
            --expect "cert-review-evidence-$VERSION=$EVIDENCE" \
            --expect "cert-review-suite-release-$VERSION=*" --expect "cert-review-suite-base-$VERSION=*"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: ${{ needs.review.outputs.verdict != '' }}
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.review.outputs.verdict }}
          path: ${{ runner.temp }}/cert-review
          digest-mismatch: error

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: ${{ needs.pack.outputs.id != '' }}
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.pack.outputs.id }}
          path: ${{ runner.temp }}/pack
          digest-mismatch: error

      - name: The line, from the build, the findings and the verdict
        id: record
        env:
          ARTIFACTS: ${{ steps.artifacts.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/cert-review" "$RUNNER_TEMP/pack"
          findings="$RUNNER_TEMP/cert-review/findings.json"
          tgz=$(find "$RUNNER_TEMP/pack" -maxdepth 1 -name '*.tgz' | head -1)
          if tools/cert-review/gate.sh record node tools/cert-review/record.mjs --version "$VERSION" --review "$RUNNER_TEMP/cert-review" \
            --out "$RUNNER_TEMP/record" --run "$RUN_URL" --repo "$GH_REPO" --commit "$PLAN_COMMIT" \
            --pr "$PR" --head "$HEAD_SHA" --tarball "$tgz" --sha256 "$SHA256" --review-result "$REVIEW" --jobs "$JOBS,artifacts=$ARTIFACTS" \
            --findings "$findings"; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          else
            state=$(node -p 'require(process.argv[1]).state || "failure"' "$RUNNER_TEMP/record/record.json" 2> /dev/null || echo failure)
            [ "$state" != success ] || state=failure
            echo "conclusion=$state" >> "$GITHUB_OUTPUT"
          fi
          commit=$(node -p 'require(process.argv[1]).commit || ""' "$RUNNER_TEMP/record/record.json")
          echo "commit=${commit:-$PLAN_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "line=$(head -1 "$RUNNER_TEMP/record/line.txt")" >> "$GITHUB_OUTPUT"
          { echo '```'; cat "$RUNNER_TEMP/record/line.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: cert-review-record-${{ needs.plan.outputs.version }}
          path: |
            ${{ runner.temp }}/record/record.json
            ${{ runner.temp }}/record/line.txt
            ${{ runner.temp }}/record/body.md
          if-no-files-found: error

  report:
    name: cert-review-pr / report
    needs: [plan, same, record]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.plan.outputs.go == 'true' && needs.same.outputs.identical != 'true' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CONCLUSION: ${{ needs.record.outputs.conclusion }}
      LINE: ${{ needs.record.outputs.line }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: ${{ needs.record.outputs.artifact != '' }}
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.record.outputs.artifact }}
          path: ${{ runner.temp }}/record
          digest-mismatch: error

      - name: The verdict as the cert-review status on the pull request's head, and in a comment
        run: |
          set -euo pipefail
          state=${CONCLUSION:-error}
          line=${LINE:-"cert-ci: INCOMPLETE #$PR: no record (re-run the failed jobs)"}
          desc=$(printf '%s' "$line" | cut -c1-140)
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GH_REPO/statuses/$HEAD_SHA" \
            -d "$(node -e 'console.log(JSON.stringify({ state: process.argv[1], context: process.argv[2], target_url: process.argv[3], description: process.argv[4] }))' "$state" "$CERT_CONTEXT" "$RUN_URL" "$desc")" > /dev/null
          echo "$CERT_CONTEXT $state on $HEAD_SHA: $line"
          { echo '```'; echo "$line"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          body="$RUNNER_TEMP/record/body.md"
          [ -f "$body" ] || printf '%s\n' '<!-- cert-review -->' "$line" '<!-- /cert-review -->' > "$body"
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains("<!-- cert-review -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@"$body" > /dev/null
          fi
          if [ "$state" != success ]; then echo "::error title=cert-review::$line"; exit 1; fi

  group-pack:
    name: cert-review-pr / merge group pack
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      name: kernel-tgz-${{ steps.version.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.merge_group.base_ref }}
          persist-credentials: false

      - name: The tree under test, the merge group, with main's tools
        run: git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      - id: version
        run: |
          set -euo pipefail
          latest=$(npm view @ai-ecoverse/slicc-kernel dist-tags.latest --prefer-online)
          [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::npm's latest reads as '$latest'"; exit 1; }
          IFS=. read -r major minor patch <<< "$latest"
          echo "version=$major.$minor.$((patch + 1))-group.$GITHUB_RUN_ID" | tee -a "$GITHUB_OUTPUT"

      - id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tools/cert-review/gate.sh pack node tools/cert-review/pack.mjs --version "$VERSION" --ref "$GITHUB_SHA" --out "$RUNNER_TEMP/pack"
          echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP"/pack/*.tgz.sha256)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: upload
        with:
          name: kernel-tgz-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/pack/*.tgz
            ${{ runner.temp }}/pack/*.tgz.sha256
            ${{ runner.temp }}/pack/pack.json
          if-no-files-found: error

  canary:
    name: cert-review-pr / downstream bios canary
    needs: group-pack
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
      actions: read
    uses: ai-ecoverse/slicc-bios/.github/workflows/canary.yml@c2cec127b935419049568f584093d7ef03ac0721
    with:
      candidate-package: '@ai-ecoverse/slicc-kernel'
      candidate-artifact: ${{ needs.group-pack.outputs.name }}
      candidate-run: ${{ github.run_id }}
      candidate-sha256: ${{ needs.group-pack.outputs.sha256 }}
      candidate-repo: ${{ github.repository }}
      candidate-artifact-id: ${{ needs.group-pack.outputs.id }}
      candidate-artifact-digest: ${{ needs.group-pack.outputs.digest }}
      shards: '["sweep","guard","k4-link"]'
      repeat: 1
      label: kernel

  group:
    name: cert-review-pr / merge group
    needs: [guard, canary]
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.merge_group.base_ref }}
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - name: The canary's result, from its artifact by id and digest (the result output can be up to 512 KB, more than one environment variable holds)
        if: ${{ needs.canary.outputs.artifact-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.canary.outputs.artifact-id }}
          path: ${{ runner.temp }}/canary
          digest-mismatch: error

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - id: downstream
        name: bios's canary on the merge group, judged against the pinned bios (a regression or no result is not certified)
        env:
          OVERRIDE: ${{ needs.guard.outputs.override }}
        run: |
          override=$(node -e 'let r; try { r = JSON.parse(process.env.OVERRIDE); } catch {} const m = r?.members ?? []; process.stdout.write(r?.status === "PASS" && m.length > 0 && m.every((x) => x.approved === true && x.touched?.length > 0) ? "PASS" : "FAIL")')
          echo "downstream-override: $override (every pull request in the group needs it on its head)"
          tools/cert-review/gate.sh --evidence downstream node tools/cert-review/downstream.mjs --result "$RUNNER_TEMP/canary/result.json" --override "$override" \
            --bios c2cec127b935419049568f584093d7ef03ac0721 --shards sweep,guard,k4-link --out "$RUNNER_TEMP/downstream.json"

      - id: lookup
        name: Each pull request in the group has a certified review of the head being merged, or changes no behaviour, and the group passes downstream
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GUARD: ${{ needs.guard.outputs.status }}
        run: |
          tools/cert-review/gate.sh 'pr lookup' node tools/cert-review/pr.mjs lookup --repo "$GITHUB_REPOSITORY" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --run "$GITHUB_RUN_ID" --context "$CERT_CONTEXT" --guard "$GUARD" --approval cert-review-approved --downstream "$RUNNER_TEMP/downstream.json"

      - name: bios's canary failing on main opens one issue, and a passing group closes it
        if: ${{ !cancelled() && steps.downstream.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          tools/cert-review/gate.sh 'pr notice' node tools/cert-review/pr.mjs notice --repo "$GITHUB_REPOSITORY" --head "$HEAD_SHA" --run "$GITHUB_RUN_ID" \
            --bios c2cec127b935419049568f584093d7ef03ac0721 --downstream "$RUNNER_TEMP/downstream.json"

      - name: A lookup that failed still leaves a status, so the required check never waits forever
        if: failure() && steps.lookup.outputs.posted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"error\",\"context\":\"$CERT_CONTEXT\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"cert-review did not finish its lookup: re-run the failed jobs\"}" > /dev/null
