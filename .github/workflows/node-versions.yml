name: Node versions

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - .github/workflows/node-versions.yml

permissions:
  contents: read

concurrency:
  group: node-versions-${{ github.ref }}-${{ github.run_id }}

jobs:
  node-versions:
    name: node kernel on Node ${{ matrix.node }} (jit_page crashes, #1129)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    permissions:
      contents: read
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: The suites that run the node kernel, counting V8's jit_page crashes
        env:
          NODE_MAJOR: ${{ matrix.node }}
        run: |
          mapfile -t files < <(grep -l "dist/node.js" test/integration/*.test.mjs)
          set +e
          node --test --test-timeout=180000 --test-reporter=tap "${files[@]}" > "$RUNNER_TEMP/node-suite.log" 2>&1
          status=$?
          set -e
          tail -n 40 "$RUNNER_TEMP/node-suite.log"
          jit=$(grep -c 'jit_page' "$RUNNER_TEMP/node-suite.log" || true)
          signals=$(grep -cE "signal: '?SIG(TRAP|SEGV|ILL|ABRT|BUS)" "$RUNNER_TEMP/node-suite.log" || true)
          line="node-versions: Node $(node -p process.version), ${#files[@]} files, exit $status, jit_page lines $jit, test processes ended by a crash signal $signals"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: node-suite-log-node${{ matrix.node }}
          path: ${{ runner.temp }}/node-suite.log
          if-no-files-found: ignore
