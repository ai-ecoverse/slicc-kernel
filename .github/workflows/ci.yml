name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CERT_LIGHT_RUNNER || vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.merge_group.base_ref || github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/runner.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: pick
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          FORCED: ${{ vars.CI_RUNNER }}
          POOL: ${{ vars.CERT_RUNNER }}
        with:
          script: |
            const { runner, why } = await import(`${process.env.GITHUB_WORKSPACE}/.github/runner.mjs`)
              .then(({ decide }) => decide({ context, github, env: process.env }))
              .catch((error) => ({ runner: 'ubuntu-latest', why: `the decider failed: ${error.message}` }));
            core.setOutput('runner', runner);
            await core.summary.addRaw(`runner: ${runner} (${why})\n`).write();

  ci:
    needs: runner
    if: ${{ !cancelled() }}
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-ci.yml@v1.24.1
    with:
      runs-on: ${{ needs.runner.outputs.runner || 'ubuntu-latest' }}
      timeout-minutes: 35

  node-versions:
    name: node kernel on Node ${{ matrix.node }} (jit_page crashes, #1129)
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    permissions:
      contents: read
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: The suites that run the node kernel, counting V8's jit_page crashes
        env:
          NODE_MAJOR: ${{ matrix.node }}
        run: |
          mapfile -t files < <(grep -l "dist/node.js" test/integration/*.test.mjs)
          set +e
          node --test --test-timeout=180000 "${files[@]}" > "$RUNNER_TEMP/node-suite.log" 2>&1
          status=$?
          set -e
          tail -n 40 "$RUNNER_TEMP/node-suite.log"
          jit=$(grep -c 'jit_page' "$RUNNER_TEMP/node-suite.log" || true)
          signals=$(grep -cE "signal: '?SIG(TRAP|SEGV|ILL|ABRT|BUS)" "$RUNNER_TEMP/node-suite.log" || true)
          line="node-versions: Node $(node -p process.version), ${#files[@]} files, exit $status, jit_page lines $jit, test processes ended by a crash signal $signals"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: node-suite-log-node${{ matrix.node }}
          path: ${{ runner.temp }}/node-suite.log
          if-no-files-found: ignore
