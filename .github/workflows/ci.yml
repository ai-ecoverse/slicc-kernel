name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CERT_LIGHT_RUNNER || vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.merge_group.base_ref || github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/runner.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: pick
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          FORCED: ${{ vars.CI_RUNNER }}
          POOL: ${{ vars.CERT_RUNNER }}
        with:
          script: |
            const { runner, why } = await import(`${process.env.GITHUB_WORKSPACE}/.github/runner.mjs`)
              .then(({ decide }) => decide({ context, github, env: process.env }))
              .catch((error) => ({ runner: 'ubuntu-latest', why: `the decider failed: ${error.message}` }));
            core.setOutput('runner', runner);
            await core.summary.addRaw(`runner: ${runner} (${why})\n`).write();

  ci:
    needs: runner
    if: ${{ !cancelled() }}
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-ci.yml@v1.29.2
    with:
      runs-on: ${{ needs.runner.outputs.runner || 'ubuntu-latest' }}
      timeout-minutes: 45
