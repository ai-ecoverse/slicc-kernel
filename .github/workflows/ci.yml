name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint, no comments, no unit tests
        run: npm run lint

      - name: Install Chromium
        run: npx playwright-core install --with-deps --no-shell chromium

      - name: Integration tests with coverage, CPU profiles, and screenshots
        run: npm test

      - name: Hotspots
        if: always()
        run: cat artifacts/hotspots.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-profiles-screenshots
          path: |
            coverage/
            artifacts/
          if-no-files-found: ignore
